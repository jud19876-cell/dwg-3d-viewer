<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DXF 2D/3D 웹 도면 뷰어</title>
  
  <!-- Google Fonts (Pretendard / Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Three.js (r128) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Three.js OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- dxf-parser -->
  <script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.js"></script>

  <style>
    :root {
      --bg-primary: #12151e;
      --bg-surface: rgba(26, 30, 44, 0.85);
      --bg-hover: rgba(42, 48, 68, 0.9);
      --border-color: rgba(255, 255, 255, 0.12);
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --shadow-lg: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* UI Layer */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .ui-layer * {
      pointer-events: auto;
    }

    /* Header Bar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-lg);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(to right, #ffffff, #d1d5db);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--bg-hover);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--accent-color);
      border-color: var(--accent-color);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Floating Side Panel (Layers) */
    .sidebar {
      position: absolute;
      top: 76px;
      right: 24px;
      width: 280px;
      max-height: calc(100vh - 150px);
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar.collapsed {
      opacity: 0;
      pointer-events: none;
      transform: translateX(20px);
    }

    .sidebar-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
    }

    .sidebar-content {
      padding: 10px;
      overflow-y: auto;
      flex: 1;
    }

    .layer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 6px;
      transition: background 0.15s ease;
      font-size: 13px;
    }

    .layer-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .layer-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .layer-color {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .layer-name {
      max-width: 160px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .layer-checkbox {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--accent-color);
    }

    /* Drag & Drop Overlay Zone */
    #dropzone-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      background: rgba(18, 21, 30, 0.88);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.3s ease;
    }

    #dropzone-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .dropzone-box {
      width: 480px;
      max-width: 90%;
      padding: 48px 32px;
      border: 2px dashed rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dropzone-box:hover, .dropzone-box.dragover {
      border-color: var(--accent-color);
      background: rgba(59, 130, 246, 0.08);
      transform: scale(1.01);
    }

    .dropzone-icon {
      width: 64px;
      height: 64px;
      background: rgba(59, 130, 246, 0.15);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-color);
    }

    .dropzone-icon svg {
      width: 36px;
      height: 36px;
      fill: currentColor;
    }

    .dropzone-title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
    }

    .dropzone-sub {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.5;
    }

    /* Footer Status Bar */
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px;
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-sub);
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-item strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent-color);
      font-weight: 600;
      font-size: 11px;
    }

    /* Controls Help Guide Overlay */
    .controls-guide {
      position: absolute;
      bottom: 50px;
      left: 24px;
      background: rgba(18, 21, 30, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-sub);
      display: flex;
      gap: 16px;
      pointer-events: none;
    }

    .controls-guide span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .controls-guide kbd {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
    }

    #file-input {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Three.js Canvas Container -->
  <div id="canvas-container"></div>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="brand-icon">DXF</div>
        <div class="brand-title">DXF 2D/3D 도면 뷰어</div>
      </div>
      <div class="toolbar">
        <button class="btn btn-primary" id="btn-open-file">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          파일 열기
        </button>
        <button class="btn" id="btn-fit-view" title="화면에 맞추기">
          <svg viewBox="0 0 24 24"><path d="M3 5v4h2V7h2V5H3zm0 10h2v-2H3v4zm14 4h2v-4h-2v4zm2-14h-4v2h2v2h2V5z"/></svg>
          화면 맞춤
        </button>
        <button class="btn" id="btn-toggle-view" title="2D/3D 시점 전환">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          <span id="view-mode-text">2D / 3D 전환</span>
        </button>
        <button class="btn" id="btn-toggle-layers">
          <svg viewBox="0 0 24 24"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/></svg>
          레이어 목록
        </button>
        <button class="btn" id="btn-toggle-bg">
          <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.40 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
          배경색
        </button>
      </div>
    </header>

    <!-- Side Layer Panel -->
    <div class="sidebar collapsed" id="layer-sidebar">
      <div class="sidebar-header">
        <span>레이어 목록 (<span id="layer-count">0</span>)</span>
        <button class="btn" id="btn-close-sidebar" style="padding: 4px 8px;">✕</button>
      </div>
      <div class="sidebar-content" id="layer-list-container">
        <!-- Layer Items populated dynamically -->
      </div>
    </div>

    <!-- Mouse Controls Helper Banner -->
    <div class="controls-guide">
      <span><kbd>마우스 왼쪽 드래그</kbd> 도면 이동 (Pan)</span>
      <span><kbd>마우스 휠</kbd> 확대 / 축소 (Zoom)</span>
      <span><kbd>마우스 오른쪽 드래그</kbd> 3D 회전 (Rotate)</span>
    </div>

    <!-- Footer Status Bar -->
    <footer>
      <div class="status-group">
        <div class="status-item">
          <span>파일명:</span>
          <strong id="status-filename">열린 파일 없음</strong>
        </div>
        <div class="status-item">
          <span>객체 수:</span>
          <strong id="status-entities">0 개</strong>
        </div>
      </div>
      <div class="status-group">
        <div class="status-item">
          <span>좌표:</span>
          <strong id="status-coords">X: 0.00, Y: 0.00, Z: 0.00</strong>
        </div>
        <div class="status-item">
          <span class="badge" id="status-mode">2D Orthographic Mode</span>
        </div>
      </div>
    </footer>
  </div>

  <!-- Drag and Drop Overlay / Initial Screen -->
  <div id="dropzone-overlay">
    <div class="dropzone-box" id="dropzone-box">
      <div class="dropzone-icon">
        <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
      </div>
      <div class="dropzone-title">DXF / DWG 도면 파일을 드래그 앤 드롭 하세요</div>
      <div class="dropzone-sub">
        또는 이 상자를 클릭하여 컴퓨터에서 도면 파일을 선택하세요.<br>
        (AutoCAD 2D/3D <strong>.dxf</strong> 파일 즉시 로드 / <strong>.dwg</strong> 지원 안내)
      </div>
      <button class="btn btn-primary" style="margin-top: 8px;">파일 선택하기</button>
    </div>
  </div>

  <input type="file" id="file-input" accept=".dxf,.dwg">

  <script>
    // --- ACI (AutoCAD Color Index) Table (1 - 255) ---
    const ACI_COLORS = [
      0x000000, 0xff0000, 0xffff00, 0x00ff00, 0x00ffff, 0x0000ff, 0xff00ff, 0xffffff,
      0x808080, 0xc0c0c0, 0xff0000, 0xff8080, 0xa50000, 0xa55252, 0x7f0000, 0x7f3f3f,
      0x4c0000, 0x4c2626, 0x260000, 0x261313, 0xff3f00, 0xff9f7f, 0xa52900, 0xa56752,

      0xa55200, 0xa57b52, 0x7f3f00, 0x7f5f3f, 0x4c2600, 0x4c3926, 0x261300, 0x261c13,
      0xffbf00, 0xffdf7f, 0xa57b00, 0xa59052, 0x7f5f00, 0x7f6f3f, 0x4c3900, 0x4c4326,
      0x261c00, 0x262113, 0xffff00, 0xffff7f, 0xa5a500, 0xa5a552, 0x7f7f00, 0x7f7f3f,
      0x4c4c00, 0x4c4c26, 0x262600, 0x262613, 0xbfff00, 0xdf807f, 0x7ba500, 0x90a552,
      0x5f7f00, 0x6f7f3f, 0x394c00, 0x434c26, 0x1c2600, 0x212613, 0x7fff00, 0xbf807f,
      0x52a500, 0x7ba552, 0x3f7f00, 0x5f7f3f, 0x264c00, 0x394c26, 0x132600, 0x1c2613,
      0x3fff00, 0x9fff7f, 0x29a500, 0x67a552, 0x1f7f00, 0x4f7f3f, 0x134c00, 0x2f4c26,
      0x092600, 0x172613, 0x00ff00, 0x7fff7f, 0x00a500, 0x52a552, 0x007f00, 0x3f7f3f,
      0x004c00, 0x264c26, 0x002600, 0x132613, 0x00ff3f, 0x7fff9f, 0x00a529, 0x52a567,
      0x007f1f, 0x3f7f4f, 0x004c13, 0x264c2f, 0x002609, 0x132617, 0x00ff7f, 0x7fffbf,
      0x00a552, 0x52a57b, 0x007f3f, 0x3f7f5f, 0x004c26, 0x264c39, 0x002613, 0x13261c,
      0x00ffbf, 0x7fffdf, 0x00a57b, 0x52a590, 0x007f5f, 0x3f7f6f, 0x004c39, 0x264c43,
      0x00261c, 0x132621, 0x00ffff, 0x7ffff1, 0x00a5a5, 0x52a5a5, 0x007f7f, 0x3f7f7f,
      0x004c4c, 0x264c4c, 0x002626, 0x132626, 0x00bfff, 0x7fdf7f, 0x007ba5, 0x5290a5,
      0x005f7f, 0x3f6f7f, 0x00394c, 0x26434c, 0x001c26, 0x132126, 0x007fff, 0x7fbf7f,
      0x0052a5, 0x527ba5, 0x003f7f, 0x3f5f7f, 0x00264c, 0x26394c, 0x001326, 0x131c26,
      0x003fff, 0x7f9f7f, 0x0029a5, 0x5267a5, 0x001f7f, 0x3f4f7f, 0x00134c, 0x262f4c,
      0x000926, 0x131726, 0x0000ff, 0x7f7f7f, 0x0000a5, 0x5252a5, 0x00007f, 0x3f3f7f,
      0x00004c, 0x26264c, 0x000026, 0x131326, 0x3f00ff, 0x9f7f7f, 0x2900a5, 0x6752a5,
      0x1f007f, 0x4f3f7f, 0x13004c, 0x2f264c, 0x090026, 0x171326, 0x7f00ff, 0xbf7f7f,
      0x5200a5, 0x7b52a5, 0x3f007f, 0x5f3f7f, 0x26004c, 0x39264c, 0x130026, 0x1c1326,
      0xbf00ff, 0xdf7f7f, 0x7b00a5, 0x9052a5, 0x5f007f, 0x6f3f7f, 0x39004c, 0x43264c,
      0x1c0026, 0x211326, 0xff00ff, 0xff7f7f, 0xa500a5, 0xa552a5, 0x7f007f, 0x7f3f7f,
      0x4c004c, 0x4c264c, 0x260026, 0x261326, 0xff00bf, 0xff7fdf, 0xa5007b, 0xa55290,
      0x7f005f, 0x7f3f6f, 0x4c0039, 0x4c2643, 0x26001c, 0x261321, 0xff007f, 0xff7fbf,
      0xa50052, 0xa5527b, 0x7f003f, 0x7f3f5f, 0x4c0026, 0x4c2639, 0x260013, 0x26131c,
      0xff003f, 0xff7f9f, 0xa50029, 0xa55267, 0x7f001f, 0x7f3f4f, 0x4c0013, 0x4c262f,
      0x260009, 0x261317, 0x333333, 0x505050, 0x696969, 0x828282, 0x9b9b9b, 0xffffff
    ];

    function getAciColor(colorIndex, layerColor) {
      if (colorIndex === 256 || colorIndex === undefined || colorIndex === null) {
        // ByLayer
        return layerColor !== undefined ? layerColor : 0xffffff;
      }
      if (colorIndex === 0) return 0xffffff; // ByBlock
      if (colorIndex === 7) return 0xffffff; // White on dark bg
      if (colorIndex >= 0 && colorIndex < ACI_COLORS.length) {
        return ACI_COLORS[colorIndex];
      }
      return 0xffffff;
    }

    // --- Global Application State ---
    let scene, renderer, camera, orthoCamera, perspectiveCamera, controls;
    let dxfGroup = null;
    let is3DMode = false;
    let layersMap = new Map(); // layerName -> { group: THREE.Group, color: hex }
    let parsedDxfData = null;
    let totalEntitiesCount = 0;
    let currentBgIndex = 0;
    const bgColors = [0x12151e, 0x000000, 0x1e2430];

    // Mouse Raycaster for Coordinate Display
    const raycaster = new THREE.Raycaster();
    const mouseVector = new THREE.Vector2();
    const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

    // --- Initialization ---
    function init() {
      const container = document.getElementById('canvas-container');
      const width = container.clientWidth;
      const height = container.clientHeight;

      // 1. Scene setup
      scene = new THREE.Scene();
      scene.background = new THREE.Color(bgColors[0]);

      // 2. Camera setup
      // Orthographic Camera for 2D Mode
      const aspect = width / height;
      const initialSize = 100;
      orthoCamera = new THREE.OrthographicCamera(
        -initialSize * aspect, initialSize * aspect,
        initialSize, -initialSize,
        -10000, 10000
      );
      orthoCamera.position.set(0, 0, 100);
      orthoCamera.up.set(0, 1, 0);

      // Perspective Camera for 3D Mode
      perspectiveCamera = new THREE.PerspectiveCamera(45, aspect, 0.1, 50000);
      perspectiveCamera.position.set(0, 0, 100);
      perspectiveCamera.up.set(0, 1, 0);

      camera = orthoCamera;

      // 3. Renderer setup
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);
      container.appendChild(renderer.domElement);

      // 4. Controls setup
      // CRITICAL REQUIREMENT: Left-click drag -> PAN, Mouse Wheel -> ZOOM
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.15;
      controls.screenSpacePanning = true;
      controls.mouseButtons = {
        LEFT: THREE.MOUSE.PAN,
        MIDDLE: THREE.MOUSE.DOLLY,
        RIGHT: THREE.MOUSE.ROTATE
      };
      controls.touches = {
        ONE: THREE.TOUCH.PAN,
        TWO: THREE.TOUCH.DOLLY_PAN
      };
      
      // Lock rotation in 2D mode initially
      controls.enableRotate = false;

      // Ambient Light for 3D faces/solids
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
      dirLight.position.set(1, 1, 2).normalize();
      scene.add(dirLight);

      // Event Listeners
      window.addEventListener('resize', onWindowResize);
      renderer.domElement.addEventListener('mousemove', onMouseMove);

      setupUIEvents();
      setupDragAndDrop();

      // Render Loop
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      const container = document.getElementById('canvas-container');
      const width = container.clientWidth;
      const height = container.clientHeight;
      const aspect = width / height;

      if (camera.isOrthographicCamera) {
        const frustumHeight = camera.top - camera.bottom;
        camera.left = -frustumHeight * aspect / 2;
        camera.right = frustumHeight * aspect / 2;
        camera.updateProjectionMatrix();
      } else {
        camera.aspect = aspect;
        camera.updateProjectionMatrix();
      }

      renderer.setSize(width, height);
    }

    function onMouseMove(event) {
      mouseVector.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouseVector.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouseVector, camera);
      const intersectionPoint = new THREE.Vector3();
      raycaster.ray.intersectPlane(planeZ, intersectionPoint);

      if (intersectionPoint) {
        document.getElementById('status-coords').innerText = 
          `X: ${intersectionPoint.x.toFixed(2)}, Y: ${intersectionPoint.y.toFixed(2)}, Z: ${intersectionPoint.z.toFixed(2)}`;
      }
    }

    // --- UI Event Handlers ---
    function setupUIEvents() {
      const fileInput = document.getElementById('file-input');
      
      document.getElementById('btn-open-file').addEventListener('click', () => fileInput.click());
      document.getElementById('dropzone-box').addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          loadDxfFile(e.target.files[0]);
        }
      });

      document.getElementById('btn-fit-view').addEventListener('click', fitViewToBoundingBox);

      document.getElementById('btn-toggle-view').addEventListener('click', toggleViewMode);

      document.getElementById('btn-toggle-layers').addEventListener('click', () => {
        const sidebar = document.getElementById('layer-sidebar');
        sidebar.classList.toggle('collapsed');
      });

      document.getElementById('btn-close-sidebar').addEventListener('click', () => {
        document.getElementById('layer-sidebar').classList.add('collapsed');
      });

      document.getElementById('btn-toggle-bg').addEventListener('click', () => {
        currentBgIndex = (currentBgIndex + 1) % bgColors.length;
        scene.background = new THREE.Color(bgColors[currentBgIndex]);
      });
    }

    // --- Drag & Drop Setup ---
    function setupDragAndDrop() {
      const overlay = document.getElementById('dropzone-overlay');
      const box = document.getElementById('dropzone-box');

      window.addEventListener('dragover', (e) => {
        e.preventDefault();
        overlay.classList.remove('hidden');
        box.classList.add('dragover');
      });

      window.addEventListener('dragleave', (e) => {
        if (e.clientX === 0 && e.clientY === 0 && dxfGroup !== null) {
          overlay.classList.add('hidden');
        }
        box.classList.remove('dragover');
      });

      window.addEventListener('drop', (e) => {
        e.preventDefault();
        box.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
          loadDxfFile(e.dataTransfer.files[0]);
        }
      });
    }

    // --- DXF / DWG File Loader ---
    function loadDxfFile(file) {
      document.getElementById('status-filename').innerText = file.name;
      
      const fileNameLower = file.name.toLowerCase();
      if (fileNameLower.endsWith('.dwg')) {
        // Attempt to upload DWG to backend server API at http://localhost:3000
        const formData = new FormData();
        formData.append('file', file);

        const serverUrl = window.location.origin.startsWith('http') ? '/api/upload' : 'http://localhost:3000/api/upload';

        fetch(serverUrl, {
          method: 'POST',
          body: formData
        })
        .then(res => res.json())
        .then(res => {
          if (res.success && res.data) {
            document.getElementById('status-filename').innerText = res.fileName;
            document.getElementById('status-entities').innerText = `${res.fileSizeMb} MB`;
            renderDxf(res.data);
            document.getElementById('dropzone-overlay').classList.add('hidden');
          } else {
            alert('서버 오류: ' + (res.message || 'DWG 파일 처리 실패'));
          }
        })
        .catch(err => {
          console.error(err);
          alert(
            "🚀 DWG 도면을 여시려면 [DWG_뷰어_실행.bat] 파일만 더블 클릭해 주시면 됩니다!\n\n" +
            "현재 창은 단순 HTML 파일로 열려 있어서 백엔드 서버 연결이 필요합니다.\n" +
            "a1 폴더 안의 [DWG_뷰어_실행.bat]을 실행하시면 새 창(http://localhost:3000)에서 DWG 파일이 3D로 바로 켜집니다."
          );
        });
        return;
      }

      const reader = new FileReader();

      reader.onload = function(e) {
        try {
          const parser = new DxfParser();
          const parsed = parser.parseSync(e.target.result);
          parsedDxfData = parsed;
          renderDxf(parsed);
          document.getElementById('dropzone-overlay').classList.add('hidden');
        } catch (err) {
          console.error("DXF 파싱 오류:", err);
          alert("DXF 파일을 파싱하는 중에 오류가 발생했습니다. 올바른 ASCII DXF 파일인지 확인해 주세요.\n(" + err.message + ")");
        }
      };

      reader.readAsText(file, 'UTF-8');
    }

    // --- DXF Renderer ---
    function renderDxf(dxf) {
      if (dxfGroup) {
        scene.remove(dxfGroup);
      }

      dxfGroup = new THREE.Group();
      layersMap.clear();
      totalEntitiesCount = 0;

      // Extract Layer Colors Table
      const layerColorMap = new Map();
      if (dxf.tables && dxf.tables.layer && dxf.tables.layer.layers) {
        Object.values(dxf.tables.layer.layers).forEach(layer => {
          const colorHex = getAciColor(layer.color, 0xffffff);
          layerColorMap.set(layer.name, colorHex);
        });
      }

      // Group entities by layer
      const getLayerGroup = (layerName, colorIndex) => {
        const name = layerName || '0';
        if (!layersMap.has(name)) {
          const group = new THREE.Group();
          group.name = name;
          const defaultColor = layerColorMap.get(name) || 0xffffff;
          const layerColor = getAciColor(colorIndex, defaultColor);
          layersMap.set(name, { group: group, color: layerColor, visible: true });
          dxfGroup.add(group);
        }
        return layersMap.get(name);
      };

      // Process Entities
      if (dxf.entities && Array.isArray(dxf.entities)) {
        dxf.entities.forEach(entity => {
          const layerObj = getLayerGroup(entity.layer, entity.color);
          const threeObject = createThreeObjectForEntity(entity, layerObj.color, dxf.blocks);
          if (threeObject) {
            layerObj.group.add(threeObject);
            totalEntitiesCount++;
          }
        });
      }

      scene.add(dxfGroup);

      // Update UI
      document.getElementById('status-entities').innerText = `${totalEntitiesCount.toLocaleString()} 개`;
      updateLayerSidebar();
      fitViewToBoundingBox();
    }

    // --- Entity to Three.js Object Convertor ---
    function createThreeObjectForEntity(entity, layerColor, blocks) {
      const color = getAciColor(entity.color, layerColor);
      const material = new THREE.LineBasicMaterial({ color: color, linewidth: 1 });

      switch (entity.type) {
        case 'LINE': {
          const geom = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(entity.vertices[0].x, entity.vertices[0].y, entity.vertices[0].z || 0),
            new THREE.Vector3(entity.vertices[1].x, entity.vertices[1].y, entity.vertices[1].z || 0)
          ]);
          return new THREE.Line(geom, material);
        }

        case 'LWPOLYLINE':
        case 'POLYLINE': {
          if (!entity.vertices || entity.vertices.length === 0) return null;
          const points = [];
          const numVerts = entity.vertices.length;

          for (let i = 0; i < numVerts; i++) {
            const v1 = entity.vertices[i];
            const v2 = entity.vertices[(i + 1) % numVerts];
            const isLast = (i === numVerts - 1);

            if (v1.bulge && (v1.bulge !== 0) && (!isLast || entity.shape)) {
              const bulgePoints = getBulgeArcPoints(v1, v2, v1.bulge);
              // Avoid duplicate points
              if (points.length > 0 && bulgePoints.length > 0) {
                bulgePoints.shift();
              }
              points.push(...bulgePoints);
            } else {
              if (i === 0) points.push(new THREE.Vector3(v1.x, v1.y, v1.z || 0));
              if (!isLast || entity.shape) {
                points.push(new THREE.Vector3(v2.x, v2.y, v2.z || 0));
              }
            }
          }

          const geom = new THREE.BufferGeometry().setFromPoints(points);
          return (entity.shape) ? new THREE.LineLoop(geom, material) : new THREE.Line(geom, material);
        }

        case 'CIRCLE': {
          const curve = new THREE.EllipseCurve(
            entity.center.x, entity.center.y,
            entity.radius, entity.radius,
            0, 2 * Math.PI,
            false, 0
          );
          const points = curve.getPoints(64).map(p => new THREE.Vector3(p.x, p.y, entity.center.z || 0));
          const geom = new THREE.BufferGeometry().setFromPoints(points);
          return new THREE.Line(geom, material);
        }

        case 'ARC': {
          let startAngle = entity.startAngle;
          let endAngle = entity.endAngle;
          if (endAngle < startAngle) endAngle += 2 * Math.PI;

          const curve = new THREE.EllipseCurve(
            entity.center.x, entity.center.y,
            entity.radius, entity.radius,
            startAngle, endAngle,
            false, 0
          );
          const points = curve.getPoints(32).map(p => new THREE.Vector3(p.x, p.y, entity.center.z || 0));
          const geom = new THREE.BufferGeometry().setFromPoints(points);
          return new THREE.Line(geom, material);
        }

        case 'ELLIPSE': {
          const majorX = entity.majorAxisEndPoint.x;
          const majorY = entity.majorAxisEndPoint.y;
          const majorRadius = Math.sqrt(majorX * majorX + majorY * majorY);
          const minorRadius = majorRadius * entity.axisRatio;
          const rotation = Math.atan2(majorY, majorX);

          const curve = new THREE.EllipseCurve(
            entity.center.x, entity.center.y,
            majorRadius, minorRadius,
            entity.startAngle || 0, entity.endAngle || 2 * Math.PI,
            false, rotation
          );
          const points = curve.getPoints(64).map(p => new THREE.Vector3(p.x, p.y, entity.center.z || 0));
          const geom = new THREE.BufferGeometry().setFromPoints(points);
          return new THREE.Line(geom, material);
        }

        case 'SPLINE': {
          if (!entity.controlPoints || entity.controlPoints.length === 0) return null;
          const pts = entity.controlPoints.map(p => new THREE.Vector3(p.x, p.y, p.z || 0));
          const curve = new THREE.CatmullRomCurve3(pts);
          const points = curve.getPoints(pts.length * 8);
          const geom = new THREE.BufferGeometry().setFromPoints(points);
          return new THREE.Line(geom, material);
        }

        case 'POINT': {
          const geom = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(entity.position.x, entity.position.y, entity.position.z || 0)
          ]);
          const pMat = new THREE.PointsMaterial({ color: color, size: 2 });
          return new THREE.Points(geom, pMat);
        }

        case '3DFACE':
        case 'SOLID': {
          if (!entity.vertices || entity.vertices.length < 3) return null;
          const geom = new THREE.BufferGeometry();
          const vertices = [];

          // Triangle 1: 0, 1, 2
          vertices.push(entity.vertices[0].x, entity.vertices[0].y, entity.vertices[0].z || 0);
          vertices.push(entity.vertices[1].x, entity.vertices[1].y, entity.vertices[1].z || 0);
          vertices.push(entity.vertices[2].x, entity.vertices[2].y, entity.vertices[2].z || 0);

          // Triangle 2 (if 4 vertices): 0, 2, 3
          if (entity.vertices.length >= 4) {
            vertices.push(entity.vertices[0].x, entity.vertices[0].y, entity.vertices[0].z || 0);
            vertices.push(entity.vertices[2].x, entity.vertices[2].y, entity.vertices[2].z || 0);
            vertices.push(entity.vertices[3].x, entity.vertices[3].y, entity.vertices[3].z || 0);
          }

          geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
          geom.computeVertexNormals();

          const meshMat = new THREE.MeshStandardMaterial({
            color: color,
            side: THREE.DoubleSide,
            roughness: 0.5
          });
          return new THREE.Mesh(geom, meshMat);
        }

        case 'TEXT':
        case 'MTEXT': {
          const textStr = entity.text;
          if (!textStr) return null;
          const height = entity.height || 1.0;
          const pos = entity.startPoint || entity.position || { x: 0, y: 0, z: 0 };

          const sprite = createTextSprite(textStr, height, '#' + color.toString(16).padStart(6, '0'));
          sprite.position.set(pos.x, pos.y, pos.z || 0);
          return sprite;
        }

        case 'INSERT': {
          if (!blocks || !blocks[entity.name]) return null;
          const block = blocks[entity.name];
          const blockGroup = new THREE.Group();

          block.entities.forEach(bEntity => {
            const bObj = createThreeObjectForEntity(bEntity, layerColor, blocks);
            if (bObj) blockGroup.add(bObj);
          });

          // Position, Scale, Rotation
          const pos = entity.position || { x: 0, y: 0, z: 0 };
          blockGroup.position.set(pos.x, pos.y, pos.z || 0);

          if (entity.xScale !== undefined) blockGroup.scale.x = entity.xScale;
          if (entity.yScale !== undefined) blockGroup.scale.y = entity.yScale;
          if (entity.zScale !== undefined) blockGroup.scale.z = entity.zScale;

          if (entity.rotation) {
            blockGroup.rotation.z = (entity.rotation * Math.PI) / 180;
          }

          return blockGroup;
        }

        default:
          return null;
      }
    }

    // Bulge Arc Calculations
    function getBulgeArcPoints(p1, p2, bulge, segments = 16) {
      const theta = 4 * Math.atan(bulge);
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist === 0) return [new THREE.Vector3(p1.x, p1.y, p1.z || 0)];

      const radius = (dist / 2) / Math.sin(theta / 2);
      const alpha = (Math.PI - theta) / 2;
      const chordAngle = Math.atan2(dy, dx);
      const dir = bulge > 0 ? 1 : -1;
      const centerAngle = chordAngle + dir * alpha;

      const cx = p1.x - radius * Math.cos(centerAngle);
      const cy = p1.y - radius * Math.sin(centerAngle);

      const startAngle = Math.atan2(p1.y - cy, p1.x - cx);
      let endAngle = Math.atan2(p2.y - cy, p2.x - cx);

      if (bulge > 0 && endAngle < startAngle) endAngle += 2 * Math.PI;
      if (bulge < 0 && endAngle > startAngle) endAngle -= 2 * Math.PI;

      const points = [];
      const absRadius = Math.abs(radius);
      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const angle = startAngle + t * (endAngle - startAngle);
        const z = (p1.z !== undefined && p2.z !== undefined) ? p1.z + t * (p2.z - p1.z) : (p1.z || 0);
        points.push(new THREE.Vector3(
          cx + absRadius * Math.cos(angle),
          cy + absRadius * Math.sin(angle),
          z
        ));
      }
      return points;
    }

    // Canvas Text Sprite
    function createTextSprite(text, height, colorHex) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const fontSize = 48;
      ctx.font = `${fontSize}px sans-serif`;
      const textMetrics = ctx.measureText(text);
      const width = Math.max(textMetrics.width + 20, 64);
      canvas.width = width;
      canvas.height = fontSize + 20;

      ctx.font = `${fontSize}px sans-serif`;
      ctx.fillStyle = colorHex || '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, width / 2, (fontSize + 20) / 2);

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMaterial);

      const aspect = width / (fontSize + 20);
      const h = Math.max(height, 0.5);
      sprite.scale.set(h * aspect, h, 1);
      return sprite;
    }

    // --- Bounding Box & Fit to Screen ---
    function fitViewToBoundingBox() {
      if (!dxfGroup) return;

      const box = new THREE.Box3().setFromObject(dxfGroup);
      if (box.isEmpty()) return;

      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);

      const container = document.getElementById('canvas-container');
      const aspect = container.clientWidth / container.clientHeight;

      // Update Orthographic Camera Frustum
      const margin = 1.2;
      const orthoHeight = (maxDim / 2) * margin;
      const orthoWidth = orthoHeight * aspect;

      orthoCamera.left = -orthoWidth;
      orthoCamera.right = orthoWidth;
      orthoCamera.top = orthoHeight;
      orthoCamera.bottom = -orthoHeight;
      orthoCamera.position.set(center.x, center.y, center.z + Math.max(maxDim, 100));
      orthoCamera.lookAt(center);
      orthoCamera.updateProjectionMatrix();

      // Update Perspective Camera Position
      const fovRad = (perspectiveCamera.fov * Math.PI) / 180;
      let cameraZ = Math.abs(maxDim / 2 / Math.tan(fovRad / 2)) * margin;
      perspectiveCamera.position.set(center.x, center.y, center.z + cameraZ);
      perspectiveCamera.lookAt(center);
      perspectiveCamera.updateProjectionMatrix();

      // Update Controls Target
      controls.target.copy(center);
      controls.update();
    }

    // --- Toggle 2D / 3D Mode ---
    function toggleViewMode() {
      is3DMode = !is3DMode;

      if (is3DMode) {
        camera = perspectiveCamera;
        controls.object = perspectiveCamera;
        controls.enableRotate = true;
        document.getElementById('view-mode-text').innerText = "3D 뷰 Mode";
        document.getElementById('status-mode').innerText = "3D Perspective Mode";
        
        // Slightly tilt camera for 3D view effect
        const box = new THREE.Box3().setFromObject(dxfGroup);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        perspectiveCamera.position.set(center.x + maxDim * 0.5, center.y - maxDim * 0.5, center.z + maxDim * 0.8);
        perspectiveCamera.lookAt(center);
        controls.target.copy(center);
      } else {
        camera = orthoCamera;
        controls.object = orthoCamera;
        controls.enableRotate = false;
        
        // Reset rotation to top 2D view
        orthoCamera.position.set(controls.target.x, controls.target.y, controls.target.z + 100);
        orthoCamera.up.set(0, 1, 0);
        orthoCamera.lookAt(controls.target);
        
        document.getElementById('view-mode-text').innerText = "2D 뷰 Mode";
        document.getElementById('status-mode').innerText = "2D Orthographic Mode";
      }

      controls.update();
      onWindowResize();
    }

    // --- Layer Sidebar UI ---
    function updateLayerSidebar() {
      const container = document.getElementById('layer-list-container');
      container.innerHTML = '';

      document.getElementById('layer-count').innerText = layersMap.size;

      layersMap.forEach((layerData, layerName) => {
        const item = document.createElement('div');
        item.className = 'layer-item';

        const hexColor = '#' + layerData.color.toString(16).padStart(6, '0');

        item.innerHTML = `
          <div class="layer-info">
            <div class="layer-color" style="background-color: ${hexColor};"></div>
            <span class="layer-name" title="${layerName}">${layerName}</span>
          </div>
          <input type="checkbox" class="layer-checkbox" ${layerData.visible ? 'checked' : ''}>
        `;

        const checkbox = item.querySelector('.layer-checkbox');
        checkbox.addEventListener('change', (e) => {
          layerData.visible = e.target.checked;
          layerData.group.visible = e.target.checked;
        });

        container.appendChild(item);
      });
    }

    // Start App when loaded
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
